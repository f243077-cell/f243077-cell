name: Update README stats card

on:
  schedule:
    - cron: "17 3 * * *" # daily, 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/stats_card.py"
      - ".github/workflows/stats-card.yml"

permissions:
  contents: write

concurrency:
  group: stats-card
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Draw stats card
        run: python3 .github/scripts/stats_card.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit if the numbers changed
        run: |
          git add assets/readme/stats-dark.svg assets/readme/stats-light.svg
          if git diff --cached --quiet; then
            echo "Stats unchanged — nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update README stats card"
          git push
